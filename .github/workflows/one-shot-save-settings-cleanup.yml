name: One-shot save settings cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tampermonkey-settings-menu
          fetch-depth: 0

      - name: Patch save cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('external-player.user.js')
          source = path.read_text(encoding='utf-8')

          old = '''    // 移除旧元素
    if (style) {
        document.head.removeChild(style);
        style = undefined;
    }
    if (buttonDiv) {
        document.body.removeChild(buttonDiv);
        buttonDiv = undefined;
    }
'''
          new = '''    // 移除旧元素。先移除设置 iframe，再移除其样式，避免 iframe 回退为浏览器默认尺寸后残留在页面左侧。
    if (settingIframe) {
        settingIframe.remove();
        settingIframe = undefined;
    }
    if (style) {
        style.remove();
        style = undefined;
    }
    if (buttonDiv) {
        buttonDiv.remove();
        buttonDiv = undefined;
        settingButton = undefined;
    }
'''

          if new in source:
              print('Save cleanup is already patched.')
          elif old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          else:
              raise SystemExit('saveConfig cleanup target not found')

      - name: Validate JavaScript syntax
        run: node --check external-player.user.js

      - name: Validate diff
        run: git diff --check

      - name: Commit fix when changed
        run: |
          if git diff --quiet; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-player.user.js
          git commit -m "fix: fully close settings after save"
          git push origin HEAD:feat/tampermonkey-settings-menu
